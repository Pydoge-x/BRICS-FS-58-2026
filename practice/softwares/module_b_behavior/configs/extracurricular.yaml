# 课外场景：YOLO 检测 + ByteTrack + MMAction2（推理专用）
scene: extracurricular

models:
  detect: models/yolo/yolov8n.pt

mmaction:
  config: models/mmaction2/tsn_fast_cpu.py
  checkpoint: models/mmaction2/tsn_imagenet-pretrained-r50_8xb32-1x1x8-100e_kinetics400-rgb_20220906-2692d16c.pth
  label_file: models/mmaction2/label_map_k400.txt
  clip_len: 16
  input_size: 224
  device: cpu
  fast_mode: true
  label_mode: kinetics
  warmup_full_video: true
  infer_mode: scene
  infer_interval: 48
  max_tracks_per_infer: 2

inference:
  conf: 0.25
  iou: 0.45
  imgsz: 640
  device: cpu
  classes: [0]

tracking:
  enabled: true
  tracker: bytetrack.yaml

clip:
  min_frames: 16
  max_frames: 32
  fps: 30
