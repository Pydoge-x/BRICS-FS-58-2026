<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情识别 - 推理测试平台</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>😊 FER 平台</h1>
                <p>Face Expression Recognition</p>
            </div>
            
            <!-- 模型选择 -->
            <section class="panel">
                <h3>模型选择</h3>
                <select id="model-select" class="select-model">
                    <option value="">加载中...</option>
                </select>
                <div id="model-info" class="model-info">
                    <span class="tag" id="model-status">未连接</span>
                </div>
                <button id="btn-reload-models" class="btn btn-sm">刷新模型列表</button>
            </section>
            
            <!-- 检测设置 -->
            <section class="panel">
                <h3>检测设置</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="detect-face" checked>
                    启用人脸检测
                </label>
                <div class="setting-row">
                    <span>检测器:</span>
                    <select id="detector-select" class="select-model" style="width:140px;">
                        <option value="insightface">InsightFace</option>
                        <option value="opencv">OpenCV</option>
                    </select>
                    <span class="tag tag-green" id="detector-status">InsightFace</span>
                </div>
            </section>
            
            <!-- 服务状态 -->
            <section class="panel">
                <h3>服务状态</h3>
                <div class="status-row">
                    <span class="status-dot" id="api-status-dot"></span>
                    <span id="api-status-text">检测中...</span>
                </div>
                <div id="api-detail" class="text-muted"></div>
            </section>
            
            <!-- 使用说明 -->
            <section class="panel">
                <h3>使用说明</h3>
                <ul class="help-list">
                    <li>上传图片或拖拽到右侧区域</li>
                    <li>也可使用 Ctrl+V 粘贴图片</li>
                    <li>支持 jpg/png/bmp/webp 格式</li>
                    <li>切换模型后点击"识别"按钮生效</li>
                </ul>
            </section>
        </aside>
        
        <!-- 主区域 -->
        <main class="main">
            <!-- 顶栏 -->
            <header class="topbar">
                <h2>推理测试</h2>
                <div class="topbar-actions">
                    <button id="btn-clear" class="btn btn-outline">清空</button>
                </div>
            </header>
            
            <!-- 上传区 -->
            <div class="upload-area" id="upload-area">
                <div class="upload-content">
                    <div class="upload-icon">📁</div>
                    <p class="upload-text">拖拽图片到此处，或点击上传</p>
                    <p class="upload-hint">支持 JPG / PNG / BMP / WebP · 也可 Ctrl+V 粘贴</p>
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <button id="btn-upload" class="btn btn-primary">选择图片</button>
                </div>
            </div>
            
            <!-- 结果区 -->
            <div class="results-area" id="results-area" style="display:none;">
                <!-- 图片预览 + 人脸框 -->
                <div class="preview-section">
                    <div class="preview-header">
                        <h3>图片预览</h3>
                        <div class="preview-header-right">
                            <span class="text-muted" id="face-count"></span>
                            <button id="btn-change-image" class="btn btn-outline btn-sm">更换图片</button>
                            <button id="btn-recognize" class="btn btn-primary">🔍 识别</button>
                        </div>
                    </div>
                    <div class="image-preview-container">
                        <canvas id="preview-canvas"></canvas>
                        <button id="btn-preview-close" class="btn-preview-close" title="删除图片">✕</button>
                    </div>
                </div>
                
                <!-- 识别结果 -->
                <div class="results-section" id="results-section">
                    <div class="results-section-header">
                        <h3>识别结果</h3>
                        <div id="inference-meta" class="inference-meta" style="display:none;"></div>
                    </div>
                    <div id="results-container">
                        <div class="empty-state">点击上方"识别"按钮开始推理</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>
    
    <script src="/static/app.js"></script>
</body>
</html>
